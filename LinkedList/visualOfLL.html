<!-- Here’s a complete, runnable JavaScript implementation of a Singly Linked List with a basic HTML/CSS visualization so you can see how nodes are connected.
You can run this in any browser — it will display the linked list visually and update it as you add or remove nodes.

Code: Linked List with Visualization
Html
-->
<!DOCTYPE html> 
<html>
<head>
  <meta charset="UTF-8">
  <title>Linked List Visualization</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .list-container {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
    }
    .node {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 60px;
      height: 40px;
      background-color: #4CAF50;
      color: white;
      border-radius: 5px;
      margin: 5px;
      position: relative;
    }
    .arrow {
      width: 30px;
      height: 2px;
      background-color: black;
      margin: 0 5px;
      position: relative;
    }
    .arrow::after {
      content: '';
      position: absolute;
      right: -5px;
      top: -4px;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 8px solid black;
    }
    .controls {
      margin-top: 20px;
    }
    input {
      padding: 5px;
      margin-right: 5px;
    }
    button {
      padding: 5px 10px;
      margin-right: 5px;
    }
  </style>
</head>
<body>

<h2>Linked List Visualization (JavaScript)</h2>
<div class="list-container" id="list"></div>

<div class="controls">
  <input type="text" id="value" placeholder="Enter value">
  <button onclick="addNode()">Add Node</button>
  <button onclick="removeNode()">Remove First</button>
</div>

<script>
  // Node class
  class Node {
    constructor(value) {
      this.value = value;
      this.next = null;
    }
  }

  // Linked List class
  class LinkedList {
    constructor() {
      this.head = null;
    }

    append(value) {
      const newNode = new Node(value);
      if (!this.head) {
        this.head = newNode;
        return;
      }
      let current = this.head;
      while (current.next) {
        current = current.next;
      }
      current.next = newNode;
    }

    removeFirst() {
      if (!this.head) return;
      this.head = this.head.next;
    }

    toArray() {
      const elements = [];
      let current = this.head;
      while (current) {
        elements.push(current.value);
        current = current.next;
      }
      return elements;
    }
  }

  // Create linked list instance
  const list = new LinkedList();

  // Render function
  function renderList() {
    const container = document.getElementById('list');
    container.innerHTML = '';
    let current = list.head;
    while (current) {
      const nodeDiv = document.createElement('div');
      nodeDiv.className = 'node';
      nodeDiv.textContent = current.value;
      container.appendChild(nodeDiv);

      if (current.next) {
        const arrowDiv = document.createElement('div');
        arrowDiv.className = 'arrow';
        container.appendChild(arrowDiv);
      }
      current = current.next;
    }
  }

  // Add node from input
  function addNode() {
    const valueInput = document.getElementById('value');
    const value = valueInput.value.trim();
    if (value === '') {
      alert('Please enter a value.');
      return;
    }
    list.append(value);
    valueInput.value = '';
    renderList();
  }

  // Remove first node
  function removeNode() {
    list.removeFirst();
    renderList();
  }
</script>

</body>
</html>


<!-- How It Works

Node class — Represents each element in the linked list.
LinkedList class — Handles append, removeFirst, and toArray operations.
Visualization — Each node is shown as a green box, with arrows connecting them.
Controls —

Add Node: Appends a new node to the end.
Remove First: Deletes the head node.
